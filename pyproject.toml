[project]
name = "planelocket-ai"
version = "0.1.0"
description = "PlaneLocket household AI agent"
requires-python = ">=3.14"
dependencies = [
    "python-dotenv>=1.2,<2",
    "fastapi",
    "uvicorn",
    "pytest",
    "httpx2",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.ruff.lint.per-file-ignores]
"src/planelocket_agent/selector.py" = ["TRY004"]
"src/planelocket_agent/tools/decisions.py" = ["TRY004"]
"src/planelocket_agent/tools/requests.py" = ["TRY004"]